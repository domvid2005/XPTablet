<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>XPTablet</title>
<style>
html, body { margin: 0; height: 100%; background: #000; color: #e8eef8; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; overscroll-behavior: none; }
#wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; outline: none; }
#turn { display: none; margin-top: 14px; color: #93a4c0; font-size: 13px; text-align: center; padding: 0 20px; }
#txt { position: fixed; left: -1000px; top: 0; width: 1px; height: 1px; opacity: 0; font-size: 16px; }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #93a4c0; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" width="800" height="480" tabindex="-1"></canvas><div id="turn">Turn your device sideways for the full tablet.</div></div>
<input id="txt" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
<div id="boot">Loading XPTablet...</div>
<script>
(function () {
  const canvas = document.getElementById('canvas'), wrap = document.getElementById('wrap'), txt = document.getElementById('txt'), turn = document.getElementById('turn');
  let logW = 800;
  function scaleNow() { const r = canvas.getBoundingClientRect(); return Math.max(1, Math.min(3, (window.devicePixelRatio || 1) * (r.width || 800) / logW)); }
  window.lcScale = scaleNow;
  // the tablet fills the screen held sideways (its layout follows the screen's shape); upright it is shown 4:3, across the width
  function sizeCanvas() {
    const cs = getComputedStyle(wrap);
    const vw = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), vh = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const upright = vh > vw * 1.05;
    const aspect = upright ? 4 / 3 : Math.max(1.2, Math.min(2.6, vw / Math.max(1, vh)));
    logW = 480 * aspect;
    const w = Math.max(160, Math.min(vw, vh * aspect));
    canvas.style.width = w + 'px'; canvas.style.height = (w / aspect) + 'px';
    turn.style.display = upright ? 'block' : 'none';
    const s = scaleNow();
    canvas.width = Math.round(logW * s); canvas.height = Math.round(480 * s);
    if (window.Module && Module._lc_scale) { Module._lc_shape(aspect); Module._lc_scale(s); }
  }
  sizeCanvas();
  window.Module = {
    canvas: canvas,
    print: (t) => console.log(t), printErr: (t) => console.warn(t),
    onRuntimeInitialized: function () { document.getElementById('boot').style.display = 'none'; sizeCanvas(); wire(); }
  };
  function pos(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * logW / r.width, (e.clientY - r.top) * 480 / r.height]; }
  function wire() {
    const M = Module;
    sizeCanvas();
    // a mouse or a pen
    canvas.addEventListener('pointermove', (e) => { if (!e.isPrimary || e.pointerType === 'touch') return; const p = pos(e); M._lc_mouse(p[0], p[1], -1); e.preventDefault(); });
    canvas.addEventListener('pointerdown', (e) => { if (!e.isPrimary || e.pointerType === 'touch') return; M._lc_touch(0); const p = pos(e); canvas.setPointerCapture(e.pointerId); M._lc_mouse(p[0], p[1], -1); M._lc_mouse(p[0], p[1], 1); e.preventDefault(); });
    canvas.addEventListener('pointerup', (e) => { if (!e.isPrimary || e.pointerType === 'touch') return; const p = pos(e); M._lc_mouse(p[0], p[1], 0); if (e.pointerType !== 'mouse') setTimeout(() => M._lc_mouse(-1000, -1000, -1), 50); afterTap(); e.preventDefault(); });
    canvas.addEventListener('pointercancel', (e) => { if (e.pointerType !== 'touch') M._lc_mouse(-1000, -1000, 0); });
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !e.buttons) M._lc_mouse(-1000, -1000, -1); });
    // typing with the tablet's own keys off: the device's keyboard comes up for the tablet's text field (letters arrive as input)
    txt.value = ' ';
    function afterTap() { setTimeout(() => { if (M._lc_typing() && M._lc_physical_keys()) { txt.style.left = '0px'; txt.focus({ preventScroll: true }); } else if (document.activeElement === txt) txt.blur(); }, 120); }
    txt.addEventListener('input', () => {
      const v = txt.value;
      if (v.length === 0) M._lc_key(8);   // the space taken away: a backspace
      else for (const ch of v.slice(1)) M._lc_char(ch.charCodeAt(0));
      txt.value = ' ';
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    // a finger: a tap keeps still (within 10 px it is where it went down), a cancel counts as letting go there, two fingers pinch the map
    let pinch = 0, finger = null, at = null, still = true;
    const span = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      M._lc_touch(1);
      if (e.touches.length >= 2) { if (finger !== null) { M._lc_mouse(at[0], at[1], 0); finger = null; } pinch = span(e.touches); return; }
      const t = e.changedTouches[0];
      finger = t.identifier; still = true; at = pos(t); at.cx = t.clientX; at.cy = t.clientY;
      M._lc_mouse(at[0], at[1], -1); M._lc_mouse(at[0], at[1], 1);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length >= 2 && pinch > 0) { const d = span(e.touches); if (d > pinch * 1.35) { M._lc_wheel(1); pinch = d; } else if (d < pinch / 1.35) { M._lc_wheel(-1); pinch = d; } return; }
      for (const t of e.changedTouches) if (t.identifier === finger) {
        if (still && Math.hypot(t.clientX - at.cx, t.clientY - at.cy) < 10) return;
        still = false; const p = pos(t); at[0] = p[0]; at[1] = p[1]; M._lc_mouse(p[0], p[1], -1);
      }
    }, { passive: false });
    const lift = (e) => {
      e.preventDefault();
      if (e.touches.length < 2) pinch = 0;
      for (const t of e.changedTouches) if (t.identifier === finger) {
        if (!still) { const p = pos(t); at[0] = p[0]; at[1] = p[1]; }
        M._lc_mouse(at[0], at[1], -1); M._lc_mouse(at[0], at[1], 0); finger = null;
        setTimeout(() => { if (finger === null) M._lc_mouse(-1000, -1000, -1); }, 250);
        afterTap();
      }
    };
    canvas.addEventListener('touchend', lift, { passive: false });
    canvas.addEventListener('touchcancel', lift, { passive: false });
    window.addEventListener('resize', () => setTimeout(sizeCanvas, 50));
    window.addEventListener('orientationchange', () => setTimeout(sizeCanvas, 250));
    canvas.addEventListener('wheel', (e) => { M._lc_wheel(-Math.sign(e.deltaY)); e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', (e) => {
      if (!M._lc_typing() || e.target === txt) return;
      if (e.key === 'Backspace') { M._lc_key(8); e.preventDefault(); }
      else if (e.key === 'Enter') { M._lc_key(13); e.preventDefault(); }
      else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) { M._lc_char(e.key.charCodeAt(0)); e.preventDefault(); }
    });
    txt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { M._lc_key(13); e.preventDefault(); } });
    // back from sleep or another app: connect again at once
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !M.lcWs && !M.lcStop && M.lcConnect) M.lcConnect(); });
  }
})();
</script>
