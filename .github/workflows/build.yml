name: build-plugin
on: [push, workflow_dispatch]

env:
  # Check https://developer.x-plane.com/sdk/plugin-sdk-downloads/ for the current link and adjust if needed.
  SDK_URL: https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK420.zip

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch X-Plane SDK
        shell: bash
        run: |
          curl -fsSL "$SDK_URL" -o sdk.zip
          unzip -q sdk.zip -d sdk
          echo "SDK_DIR=$(find "$PWD/sdk" -type d -name CHeaders -exec dirname {} \; | head -1)" >> "$GITHUB_ENV"
      - name: Linux deps
        if: runner.os == 'Linux'
        # libcurl itself is built from source (CMakeLists.txt, XPT_BUNDLE_CURL); only OpenSSL's and zlib's static libraries are needed.
        # GitHub's Ubuntu runners use the Azure mirror under ubuntu.com. During Canonical's DNS outage (2026-11-11,
        # "Temporary failure resolving 'azure.archive.ubuntu.com'") every *.ubuntu.com mirror failed, so after two attempts the
        # sources are pointed at kernel.org's Ubuntu mirror, which does not depend on ubuntu.com. Skipped if the headers are there.
        run: |
          if dpkg -s libssl-dev zlib1g-dev >/dev/null 2>&1; then echo "libssl-dev and zlib1g-dev already installed"; exit 0; fi
          for i in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=2 update && sudo apt-get -o Acquire::Retries=2 install -y libssl-dev zlib1g-dev; then exit 0; fi
            echo "apt attempt $i failed"
            if [ "$i" = 2 ]; then
              echo "switching to mirrors.edge.kernel.org"
              printf '%s\n' \
                "deb http://mirrors.edge.kernel.org/ubuntu jammy main universe" \
                "deb http://mirrors.edge.kernel.org/ubuntu jammy-updates main universe" \
                "deb http://mirrors.edge.kernel.org/ubuntu jammy-security main universe" | sudo tee /etc/apt/sources.list
              sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
            fi
            sleep 20
          done
          exit 1
      - name: Windows deps
        if: runner.os == 'Windows'
        run: vcpkg install curl:x64-windows-static
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DXPLANE_SDK="$SDK_DIR"
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -S . -B build -DXPLANE_SDK="$SDK_DIR" -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - run: cmake --build build --config Release
      - name: Check Linux plugin dependencies
        if: runner.os == 'Linux'
        # libcurl/OpenSSL/zlib are built in: the plugin may only need libc, libm, libdl and the loader (X-Plane provides XPLM and OpenGL)
        run: |
          X=build/package/XPTablet/lin_x64/XPTablet.xpl
          objdump -p "$X" | grep NEEDED || true
          if objdump -p "$X" | grep NEEDED | grep -vE 'libc\.so|libm\.so|libdl\.so|ld-linux'; then echo "unexpected shared library dependency"; exit 1; fi
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: XPTablet-${{ runner.os }}
          path: build/package/XPTablet   # contains lin_x64 / mac_x64 / win_x64

  emulator:
    # the desktop emulator (the plugin against a stand-in X-Plane) for each system, and on Linux a screen-less run of its smoke test
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch X-Plane SDK
        shell: bash
        run: |
          curl -fsSL "$SDK_URL" -o sdk.zip
          unzip -q sdk.zip -d sdk
          echo "SDK_DIR=$(find "$PWD/sdk" -type d -name CHeaders -exec dirname {} \; | head -1)" >> "$GITHUB_ENV"
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=2 update && sudo apt-get -o Acquire::Retries=2 install -y libssl-dev zlib1g-dev \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev libegl1 libgl1-mesa-dri && exit 0
            sleep 20
          done
          exit 1
      - name: Windows deps
        if: runner.os == 'Windows'
        run: vcpkg install curl:x64-windows-static
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DXPLANE_SDK="$SDK_DIR" -DXPT_BUILD_EMULATOR=ON -DXPT_BUILD_EMULATOR_HEADLESS=ON -DXPT_BUILD_TESTS=OFF
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -S . -B build -DXPLANE_SDK="$SDK_DIR" -DXPT_BUILD_EMULATOR=ON -DXPT_BUILD_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - run: cmake --build build --config Release --target xptablet_emulator
      - name: Headless smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target xptablet_emu_headless
          ./build/xptablet_emu_headless --script emulator/tests/smoke.txt --out emulator-pictures --data emu-data --scale 2
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          exe=$(find build -maxdepth 2 -type f \( -name "XPTablet Emulator" -o -name "XPTablet Emulator.exe" \) | head -1)
          cp "$exe" out/
          cp -r "$(dirname "$exe")/XPTablet" out/
          cp docs/EMULATOR.md out/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: XPTablet-Emulator-${{ runner.os }}
          path: out
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: XPTablet-Emulator-pictures
          path: emulator-pictures

  bundle:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Merge platforms
        run: |
          mkdir -p out/XPTablet
          cp -r parts/*/* out/XPTablet/
          find out -type f
      - uses: actions/upload-artifact@v4
        with: { name: XPTablet, path: out }
