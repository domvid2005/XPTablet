# Reads a crash record's frames (XPTablet.xpl+0x...) back to functions and source lines, with the symbols the Windows build kept.
# Run by hand: the build's run id, and the offsets.
name: symbolize
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The build run whose XPTablet.xpl crashed"
        required: true
      offsets:
        description: "XPTablet.xpl offsets, separated by spaces (0x40290 0x2b35bd ...)"
        required: true
permissions:
  actions: read
  contents: read
jobs:
  symbolize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: symbols-Windows
          path: pdb
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: XPTablet-Windows
          path: plugin
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Symbolize
        env:
          OFFSETS: ${{ inputs.offsets }}
        run: |
          # the plugin with its PDB beside it; addresses from the image base the PDB was linked for (0x180000000)
          cp plugin/win_x64/XPTablet.xpl pdb/
          ls -la pdb
          S=$(command -v llvm-symbolizer || ls /usr/bin/llvm-symbolizer-* | tail -1)
          for o in $OFFSETS; do
            a=$(printf '0x%x' $((0x180000000 + o)))
            echo "== $o"
            "$S" --obj=pdb/XPTablet.xpl --demangle --inlines "$a" | sed 's/^/   /'
          done
